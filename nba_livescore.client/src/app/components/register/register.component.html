<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="w-100 w-sm-75 w-md-50 w-lg-40 bg-white p-4 rounded shadow">
    <h2 class="text-center mb-4 text-primary">Register</h2>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group mb-3">
        <label for="email" class="form-label">Email:</label>
        <input type="email" id="email" formControlName="email" class="form-control" placeholder="Enter your email">
        <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="text-danger">
          Email is required and must be valid.
        </div>
      </div>
      <div class="form-group mb-3">
        <label for="password" class="form-label">Password:</label>
        <input type="password" id="password" formControlName="password" class="form-control" placeholder="Enter your password">
        <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="text-danger">
          Password is required and must be at least 6 characters.
        </div>
      </div>
      <div class="form-group mb-3">
        <label for="confirmPassword" class="form-label">Confirm Password:</label>
        <input type="password" id="confirmPassword" formControlName="confirmPassword" class="form-control" placeholder="Confirm your password">
        <div *ngIf="registerForm.get('confirmPassword')?.invalid && registerForm.get('confirmPassword')?.touched" class="text-danger">
          Confirm password is required and must be at least 6 characters.
        </div>
        <div *ngIf="registerForm.hasError('mismatch') && registerForm.get('confirmPassword')?.touched" class="text-danger">
          Passwords do not match.
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 mt-3">Register</button>
    </form>
    <div *ngIf="errorMessage" class="text-danger text-center mt-3">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="text-success text-center mt-3">{{ successMessage }}</div>
    <p class="text-center mt-3">Already have an account? <a [routerLink]="['/login']" class="text-primary">Login here</a></p>
  </div>
</div>
