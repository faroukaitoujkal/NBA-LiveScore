<div *ngIf="showBanner" class="fixed bottom-0 left-0 right-0 z-[100] bg-brand-dark/95 backdrop-blur-md border-t border-brand-accent p-4 shadow-[0_-10px_40px_rgba(255,87,34,0.15)] animate-slide-up">
  <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
    <div class="text-brand-text-muted text-sm sm:text-base flex-1">
      <p>
        <strong class="text-brand-text font-sports uppercase tracking-widest">🍪 Nous respectons votre vie privée.</strong>
        Ce site utilise des cookies pour améliorer votre expérience, analyser le trafic et vous proposer des contenus personnalisés.
        En continuant votre navigation, vous acceptez notre <a href="/legal/privacy" class="text-brand-accent hover:underline">Politique de Confidentialité</a>.
      </p>
    </div>
    <div class="flex gap-4 shrink-0">
      <button (click)="acceptCookies()" class="bg-brand-accent hover:bg-brand-accent-hover text-white font-sports uppercase tracking-widest font-bold py-2 px-6 rounded transition-all shadow-glow">
        Accepter
      </button>
    </div>
  </div>
</div>
